server:
  port: 8080

spring:
  application:
    name: GoalPace_Server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/goalpace?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

mybatis-plus:
  type-aliases-package: com.yan.goalpace_server.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

goalpace:
  jwt:
    secret: GoalPaceJwtSecret2026#ShiJie@SageTealTheme
    expire-hours: 72
  upload-dir: uploads
